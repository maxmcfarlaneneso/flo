{% extends "base.html" %}{% block title %}Weddings & Events | Dill Flowers{% endblock %}{% block content %}<section
    class="section">
    <div class="wrap split">
        <div>
            <p class="eyebrow">Weddings & events</p>
            <h1>Let's talk flowers.</h1>{% if wedding_image %}<img class="order-image"
                src="{{ url_for('static',filename='imgs/'+wedding_image) }}" alt="Wedding flowers">{% endif %}
        </div>
        <form method="post" class="checkout-form">{% if error %}<p class="form-error">{{ error }}</p>{% endif
            %}<label>Name *<input name="name" value="{{ form.get('name','') }}" required></label><label>Email *<input
                    name="email" type="email" value="{{ form.get('email','') }}" required></label><label>Phone<input
                    name="phone" type="tel"></label><label>Event type *<select name="event_type" required>
                    <option value="">Choose</option>
                    <option>Wedding</option>
                    <option>Party</option>
                    <option>Corporate event</option>
                </select></label><label>Date<input name="event_date" type="date"></label><label>Venue<input
                    name="venue"></label><label>Budget<input name="budget"></label><label>Tell us about the day<textarea
                    name="message" rows="6"></textarea></label><button class="button">Send request</button></form>
    </div>
</section>{% endblock %}
