<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#bcbc7f"><title>Gallery | Dill Flowers</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><script src="{{ url_for('static', filename='app.js') }}" defer></script></head><body>
<header class="site-header gallery-header"><div class="wrap header-inner"><a class="gallery-back" href="{{ url_for('home') }}">← Home</a><a class="header-logo" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='imgs/logo.png') }}" alt="Dill Flowers"></a><a class="header-icon map-icon" href="https://maps.app.goo.gl/PQTSEmWDh3NzxKww5" target="_blank" rel="noopener noreferrer">⌖</a></div></header>
<main class="gallery-page"><section class="wrap gallery-page-intro"><p class="eyebrow">Dill Flowers</p><h1>Flower gallery</h1><p class="intro">A growing collection of bouquets and arrangements made in Greenock.</p></section><section class="wrap gallery-page-grid">{% for image in gallery_images %}<button class="gallery-item gallery-reveal" type="button" data-full="{{ url_for('static', filename='imgs/' + image) }}"><img data-src="{{ url_for('static', filename='imgs/' + image) }}" alt="Flowers by Dill Flowers"></button>{% else %}<p>No gallery images yet.</p>{% endfor %}</section></main>
<footer class="site-footer gallery-footer"><div class="wrap footer-bottom"><span>© 2026 Dill Flowers</span><a href="{{ url_for('home') }}">Back to shop</a></div></footer>
<dialog class="lightbox" id="lightbox"><button class="lightbox-close" id="lightbox-close">×</button><button class="lightbox-arrow" id="lightbox-prev">‹</button><img id="lightbox-image" alt="Flowers by Dill Flowers"><button class="lightbox-arrow" id="lightbox-next">›</button><div class="lightbox-counter" id="lightbox-counter"></div></dialog></body></html>
